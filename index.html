<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Notes</title>
        <style>
      /* No flash of the old design: the library stays hidden until the page knows what to show */
      html:not(.ready) body {
        background: #f0f3f6;
      }
      html:not(.ready) .frame {
        visibility: hidden;
        animation: lib-reveal 0s linear 1.5s forwards;
      }
      @keyframes lib-reveal {
        to {
          visibility: visible;
        }
      }
    </style>
    <link rel="icon" type="image/png" href="icon32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Lekton:wght@400;700&family=Londrina+Solid:wght@900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1 class="sr-only">Highlight Note Embedder</h1>

    <!-- Reader controls (shown while reading a paper) -->
    <div id="reader-ui" class="rui hidden">
      <button id="back-btn" type="button" class="rui-btn rui-lib">My library</button>

      <div class="rui-paper-wrap">
        <button id="paper-tab" type="button" class="rui-paper" aria-haspopup="listbox" aria-expanded="false">
          <span id="paper-name" class="rui-paper-name"></span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg>
        </button>
        <div id="paper-menu" class="rui-papers hidden" role="listbox"></div>
      </div>

      <div class="rui-cats-wrap">
        <button id="cats-btn" type="button" class="rui-btn rui-cats" aria-haspopup="true" aria-expanded="false">
          <span id="cats-label">Categories: show all</span>
          <i id="cats-pen" class="rui-pen" title="New highlights use this color"></i>
        </button>
        <div id="cats-menu" class="rui-menu hidden"></div>
      </div>

      <div id="thumbs" class="rui-thumbs" aria-label="Pages"></div>

      <!-- Zoom: small text above OVERVIEW -->
      <div class="rui-zt" role="group" aria-label="Zoom">
        <span>Zoom</span>
        <button id="zoom-in" type="button">In</button>
        <span aria-hidden="true">|</span>
        <button id="zoom-out" type="button">Out</button>
        <b id="zoom-pct">100%</b>
      </div>
      <div id="zoom-toast" class="rui-toast hidden"></div>

      <button id="overview-btn" type="button" class="rui-over" aria-pressed="true" title="Show all notes when zoomed far out">
        Overview <b id="overview-state">on</b>
      </button>
    </div>

    <main class="frame">
      <section id="library">
        <div class="lib-head">
          <p class="lib-eyebrow">HIGHLIGHT NOTE EMBEDDER</p>
          <h2 class="lib-title">
            <span class="title-block"></span>
            <span class="title-text" id="title-text"></span>
          </h2>
          <label class="add-btn">
            ADD
            <input type="file" id="file-input" accept="application/pdf" hidden />
          </label>
        </div>

        <div class="band">
          <span id="lib-msg" class="lib-msg hidden"></span>
          <div class="band-info">
            <span id="lib-count" class="lib-count"></span>
            <span class="lib-note">Saved in this browser only. Clearing browsing data removes your papers.</span>
          </div>
        </div>

        <div id="lib-list" class="lib-list"></div>
      </section>
    </main>

    <div id="pages" class="hidden"></div>

    <script type="module" src="/src/flags.js"></script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/demo.js"></script>
    <script type="module" src="/src/zoompct.js"></script>
    <script type="module" src="/src/openurl.js"></script>
    <script type="module" src="/src/sample.js"></script>
    <script type="module" src="/src/library.js"></script>
    <script type="module" src="/src/preview.js"></script>
    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
